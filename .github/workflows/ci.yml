name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: noc
          POSTGRES_PASSWORD: noc
          POSTGRES_DB: noc_tickets
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U noc -d noc_tickets"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # The suite creates this database and runs the Alembic migrations on it.
      TEST_DATABASE_URL: postgresql+psycopg://noc:noc@localhost:5432/noc_tickets_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      # The LLM is replaced by a fake in the tests: no API key and no cost.
      - run: pytest -ra

  # The CrewAI version has its own, heavier dependencies (requirements-crewai.txt), so its tests
  # run in a separate job instead of being skipped.
  test-crewai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-crewai.txt pytest
      - run: pytest -ra tests/test_crew.py
