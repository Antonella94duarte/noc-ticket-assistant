[project]
name = "noc-ticket-assistant"
version = "0.1.0"
description = "LLM-powered assistant that classifies and diagnoses NOC tickets."
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends() in default arguments is the intended pattern.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.isort]
# The alembic/ migrations folder would otherwise make ruff treat the package as first-party.
known-third-party = ["alembic"]
